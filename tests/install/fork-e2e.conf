# Fork defaults for tests/install/install-update-e2e.sh (sourced as bash).
#
# This fork (cachacon-ai/hermes-agent-linux-pantheon) carries no upstream
# vYYYY.M.D release tags, so the inherited E2E could never pick a version and
# installed from NousResearch/hermes-agent. When this file is present the E2E
# runs fork-native: it installs the fork's own version tags FROM this
# repository, configures origin the way a fork checkout is, snapshots the
# install to a local backup ref, checks the fork's surface and the long-running
# services, and rolls back. Pass --no-fork to get upstream's behaviour.
#
# Everything runs inside the dev sandbox: no deploys, no production hosts, no
# secrets, and no ref is ever pushed.

FORK_REPO="${GITHUB_REPOSITORY:-cachacon-ai/hermes-agent-linux-pantheon}"

# Where the sandbox fetches --install-ref (and old installers) from.
FORK_UPSTREAM_URL="https://github.com/${FORK_REPO}.git"
# The checkout's origin after install. The sandbox ssh shim serves its fake
# remote for any github.com URL, so this only changes which code path
# `hermes update` takes (the fork path), not where bytes come from.
FORK_ORIGIN_URL="git@github.com:${FORK_REPO}.git"
FORK_BACKUP_ENV="ci-e2e"
FORK_SERVICES=true
FORK_SURFACE=true
FORK_ROLLBACK=true
